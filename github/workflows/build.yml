name: Build PXP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PPSSPP core
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a tmp_core
          curl -fL -o core.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/ppsspp_libretro_android.so.zip
          unzip -o core.zip -d tmp_core
          ls -la tmp_core
          cp tmp_core/*.so app/src/main/jniLibs/arm64-v8a/libppsspp_libretro_android.so
          ls -la app/src/main/jniLibs/arm64-v8a
      - name: Download PPSSPP assets
        run: |
          mkdir -p app/src/main/assets/PPSSPP tmp_assets
          curl -fL -o assets.zip https://github.com/orbea/libretro-ppsspp-assets/archive/refs/heads/master.zip
          unzip -q -o assets.zip -d tmp_assets
          cp -r tmp_assets/*/* app/src/main/assets/PPSSPP/
          ls app/src/main/assets/PPSSPP | head -n 30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true
      - uses: actions/upload-artifact@v4
        with:
          name: PXP-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
